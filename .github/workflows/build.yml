name: build-and-test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Checkout coordinated MCP 1.4 source for preview validation
        uses: actions/checkout@v4
        with:
          repository: flamoris-jp/flamoris-mcp-core
          ref: 873a8747d544c6c9d4ad75ddb39cabaa7978eef3
          path: .ci/mcp-core
          persist-credentials: false
      - name: Build coordinated MCP packages into temporary CI feed
        shell: pwsh
        run: |
          $feed = Join-Path $PWD 'artifacts/mcp-preview-feed'
          dotnet pack .ci/mcp-core/src/Flamoris.Mcp.Core -c Release -o $feed
          if ($LASTEXITCODE -ne 0) { throw 'Core pack failed.' }
          dotnet pack .ci/mcp-core/src/Flamoris.Mcp.Wpf -c Release -o $feed
          if ($LASTEXITCODE -ne 0) { throw 'Wpf pack failed.' }
          if (!(Test-Path NuGet.config)) { '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>' | Set-Content NuGet.config }
          dotnet nuget add source $feed --name coordinated-mcp-preview --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Preview feed setup failed.' }
      - run: dotnet restore Flamoris.Capture.slnx
      - run: dotnet build Flamoris.Capture.slnx -c Release --no-restore
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/hub-registration/connect-capture.ps1), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "`n") }
      - name: Publish standalone app and Core-based bridge
        run: ./product/packaging/publish-windows.ps1
      - name: Test contracts and actual MCP bridge with synthetic pixels
        shell: pwsh
        run: |
          $env:FLAMORIS_CAPTURE_TEST_BRIDGE = (Resolve-Path artifacts/windows/FLAMORIS-Capture-win-x64/Flamoris.Capture.Bridge.exe).Path
          dotnet test tests/Flamoris.Capture.Tests -c Release --no-build --logger trx --results-directory TestResults
      - name: Test platform MP4 encoder and contact sheet with synthetic frames
        run: dotnet test tests/Flamoris.Capture.Windows.Tests -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: flamoris-capture-win-x64-preview
          path: artifacts/windows/FLAMORIS-Capture-win-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
  registration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration preservation and failure rollback (no live server)
        run: python3 -m unittest discover -s tests/hub_registration -v
