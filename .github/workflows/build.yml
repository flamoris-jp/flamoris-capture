name: build-and-test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Flamoris.Capture.slnx
      - run: dotnet build Flamoris.Capture.slnx -c Release --no-restore
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/hub-registration/connect-capture.ps1), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "`n") }
      - name: Publish standalone app and Core-based bridge
        run: ./product/packaging/publish-windows.ps1
      - name: Test contracts and actual MCP bridge with synthetic pixels
        shell: pwsh
        run: |
          $env:FLAMORIS_CAPTURE_TEST_BRIDGE = (Resolve-Path artifacts/windows/FLAMORIS-Capture-win-x64/Flamoris.Capture.Bridge.exe).Path
          dotnet test tests/Flamoris.Capture.Tests -c Release --no-build --logger trx --results-directory TestResults
      - name: Test platform MP4 encoder and contact sheet with synthetic frames
        run: dotnet test tests/Flamoris.Capture.Windows.Tests -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: flamoris-capture-win-x64-preview
          path: artifacts/windows/FLAMORIS-Capture-win-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
  registration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration preservation and failure rollback (no live server)
        run: python3 -m unittest discover -s tests/hub_registration -v
